services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: varoq
      POSTGRES_USER: varoq
      POSTGRES_PASSWORD: varoq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  bot:
    build: ./bot
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data: